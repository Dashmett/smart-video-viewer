<body><img src="../Icon.png" width="96" height="96" alt="视频观影与 IINA"><h1>视频观影与 IINA</h1><p>独立观影 · 连续倍速 · 自定义跳转秒数</p><p class="state-unknown">请在 Safari 设置的“扩展”中启用 Smart Open in IINA。</p><p class="state-on">扩展已启用。打开有视频的网页，点击 Safari 工具栏中的扩展图标，再选择“进入独立观影”。</p><p class="state-off">扩展尚未启用。请前往 Safari 设置，启用扩展并允许访问需要观看视频的网站。</p><button class="open-preferences">打开 Safari 扩展设置</button><p>← → 快退／快进　空格 暂停　Esc 退出<br>新版启用后，请刷新已经打开的视频网页。</p></body></html>
